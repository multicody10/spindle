name: Rust supply-chain checks

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 3"

concurrency:
  group: rust-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache Rust build artifacts and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-x64-security
          cache-on-failure: true

      - name: Install prebuilt Rust security tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-audit,cargo-deny

      - name: Check Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check licenses, bans, and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources
