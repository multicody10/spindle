name: Windows release
run-name: Windows release \${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Next release version. The workflow updates all version files and commits them to main automatically (e.g. v0.1.1)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-\${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build, sign, and publish Windows installer
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TAG: \${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare release version and verify signing configuration
        id: prepare_release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: \${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          ./scripts/prepare-release.ps1 -ReleaseTag "$env:RELEASE_TAG" -EventName "$env:GITHUB_EVENT_NAME" -GitRef "$env:GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-x64-build
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Check Rust formatting
        if: \${{ success() }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        if: \${{ success() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: \${{ success() }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: \${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: \${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: \${{ env.RELEASE_TAG }}
          releaseName: Spindle \${{ env.RELEASE_TAG }}
          releaseCommitish: \${{ steps.prepare_release.outputs.release_commit }}
          releaseBody: |
            Windows x64 release of Spindle.

            Review the README and security documentation for current implementation status and known limitations.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: \${{ contains(env.RELEASE_TAG, '-beta.') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $checksum = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii $checksum
          gh release upload $env:RELEASE_TAG $checksum --clobber
