name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Windows x64 frontend validation
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type-check and build frontend
        run: npm run check

  rust:
    name: Windows x64 Rust validation
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-x64-build
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-package:
    name: Windows x64 NSIS package validation
    runs-on: windows-latest
    needs: [frontend, rust]
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache Rust release artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-x64-build
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tauriOverride = '{"bundle":{"createUpdaterArtifacts":false}}'
          npm exec -- tauri build --bundles nsis --config $tauriOverride
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $outputDir -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $outputDir; found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -le 0) { throw "NSIS installer is empty." }

          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            if ($stream.Length -lt 64) { throw "NSIS installer is too small to be a valid PE executable." }
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset + 4 -gt $stream.Length) {
              throw "NSIS installer has an invalid PE header offset."
            }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw "NSIS installer does not contain a valid Windows PE signature."
            }
          }
          finally {
            $stream.Dispose()
          }

          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "## Windows NSIS package"
            ""
            "- Installer: `$($installer.Name)`"
            "- Size: $($installer.Length) bytes"
            "- SHA-256: `$sha256`"
            "- Updater signing: intentionally disabled for this packaging-only validation"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Spindle-Windows-NSIS-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
