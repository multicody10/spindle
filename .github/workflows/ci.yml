name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64 validation
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Resolve npm cache location
        id: npm-cache
        shell: pwsh
        run: |
          "path=$(npm config get cache)" >> $env:GITHUB_OUTPUT

      - name: Cache npm package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-windows-node24-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-windows-node24-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Type-check and build frontend
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
