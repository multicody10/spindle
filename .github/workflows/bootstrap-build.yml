name: Bootstrap locked build files

on:
  push:
    branches:
      - foundation/core-platform

permissions:
  contents: write
  actions: write

concurrency:
  group: spindle-build-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate lockfiles and format Rust
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit generated build files and trigger validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --quiet .github/workflows/bootstrap-build.yml
          git add -- package-lock.json src-tauri/Cargo.lock src-tauri/src
          git add -u -- .github/workflows/bootstrap-build.yml

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Generated files are already current."
            exit 0
          }

          git commit -m "Generate locked dependencies and format Rust"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit generated build files." }

          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Could not push generated build files." }

          gh workflow run ci.yml --ref $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Windows CI." }

          gh workflow run rust-security.yml --ref $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Rust security checks." }

          gh workflow run codeql.yml --ref $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch CodeQL." }
