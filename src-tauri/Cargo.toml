[package]
name = "spindle"
version = "0.2.2"
description = "Local-first AI development environment"
authors = ["Spindle contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "spindle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-updater = "2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sha2 = "0.10.9"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# Fast incremental builds for local development and CI validation.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

# Tests inherit the fast development profile but omit debug info to reduce
# compile time and artifact size.
[profile.test]
inherits = "dev"
debug = 0
incremental = true
codegen-units = 256

# Keep release builds highly optimized without enabling full or thin LTO,
# which adds link-time work for limited benefit in this small native layer.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16